services:
  postgres:
    image: postgres:16-alpine
    container_name: pricer-postgres
    environment:
      POSTGRES_DB: pricer_dev
      POSTGRES_USER: pricer
      POSTGRES_PASSWORD: pricer_dev_password
    ports:
      - "5433:5432"
    volumes:
      - pricer_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pricer -d pricer_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pricer_postgres_data:
